<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPS AutoGear - Realtime Support Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .chat-container { width: 100%; max-width: 480px; height: 90vh; background: #1e293b; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .chat-header { background: #ff0000; color: white; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; }
    .chat-header h2 { font-size: 18px; font-weight: 800; }
    .status-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; }
    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .msg-sender { font-size: 11px; color: #94a3b8; margin-bottom: 3px; font-weight: 600; }
    .msg-mine { align-self: flex-end; background: #ff0000; color: white; border-bottom-right-radius: 2px; }
    .msg-other { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .input-form { display: flex; padding: 12px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
    .input-form input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; outline: none; }
    .input-form button { background: #ff0000; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .input-form button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h2>💬 MPS Live Support</h2>
        <span style="font-size: 12px; opacity: 0.9;">Tư vấn kỹ thuật phụ tùng xe máy 24/7</span>
      </div>
      <span class="status-badge" id="status">🔴 Đang kết nối...</span>
    </div>

    <div class="messages-box" id="messagesBox">
      <div class="msg-bubble msg-other">
        <div class="msg-sender">Hệ Thống MPS</div>
        👋 Chào mừng bạn đến với kênh Realtime Support! Bạn có câu hỏi nào về linh kiện xe máy không ạ?
      </div>
    </div>

    <form class="input-form" id="chatForm">
      <input type="text" id="messageInput" placeholder="Nhập tin nhắn tư vấn..." autocomplete="off" required />
      <button type="submit">Gửi 🚀</button>
    </form>
  </div>

  <script>
    const socket = io();
    const statusEl = document.getElementById('status');
    const messagesBox = document.getElementById('messagesBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    const userName = 'Khách hàng #' + Math.floor(Math.random() * 9000 + 1000);

    socket.on('connect', () => {
      statusEl.textContent = '🟢 Trực tuyến';
      statusEl.style.background = '#16a34a';
      socket.emit('join_room', { room: 'general' });
    });

    socket.on('disconnect', () => {
      statusEl.textContent = '🔴 Mất kết nối';
      statusEl.style.background = '#dc2626';
    });

    socket.on('receive_message', (data) => {
      const msgDiv = document.createElement('div');
      const isMine = data.sender === userName;
      msgDiv.className = 'msg-bubble ' + (isMine ? 'msg-mine' : 'msg-other');
      
      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      senderDiv.textContent = isMine ? 'Bạn' : data.sender;
      
      const textDiv = document.createElement('div');
      textDiv.textContent = data.text;

      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(textDiv);
      messagesBox.appendChild(msgDiv);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      socket.emit('send_message', {
        room: 'general',
        sender: userName,
        text: text
      });

      messageInput.value = '';
    });
  </script>
</body>
</html>
